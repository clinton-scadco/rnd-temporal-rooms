[package]
name = "temporal-rooms"
version = "0.1.0"
edition = "2021"
# Experiment 06 added a second binary, and `cargo run` will not guess.
default-run = "trooms"

[lib]
name = "temporal_rooms"
path = "src/lib.rs"

[[bin]]
name = "trooms"
path = "src/main.rs"

# Experiment 06 is a separate prototype with a separate front end, so it gets a
# separate binary rather than another subcommand on the workbench.
[[bin]]
name = "machine"
path = "src/bin/machine.rs"

# Prototype 2 is the multiplayer slice: a third binary, because it holds state
# -- rooms, clocks and one reconstruction per player -- and the two servers
# above it deliberately hold none.
[[bin]]
name = "room"
path = "src/bin/room.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
